[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-core-site-publisher"
version = "1.0.0"
description = "Deterministic ResearchRunBundleV1 publication tools"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyMuPDF>=1.25,<2",
  "reportlab>=4.2,<5"
]

[tool.setuptools.packages.find]
include = ["coscientist*"]
