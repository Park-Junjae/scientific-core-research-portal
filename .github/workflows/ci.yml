name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python tests/run_all.py
      - run: pnpm test:content
      - run: NEXT_PUBLIC_RUN_CONTROL_API_BASE=https://api.aichoscientist.com pnpm build
      - run: NEXT_PUBLIC_RUN_CONTROL_API_BASE=https://api.aichoscientist.com pnpm test:production-api-base
      - run: pnpm test:basepath -- --root
      - run: pnpm test:links
      - run: pnpm test:budget
      - run: pnpm test:privacy
      - run: pnpm test:zero-demos
      - run: pnpm test:tracked-boundary
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build credentialed-session E2E variant
        run: SCIENTIFIC_CORE_TEST_ONLY_DEMO_FIXTURES=1 NEXT_PUBLIC_RUN_CONTROL_API_BASE=https://control.example pnpm build
      - run: pnpm test:e2e
      - run: NEXT_PUBLIC_BASE_PATH=/scientific-core-research-portal pnpm build
      - run: pnpm test:basepath -- /scientific-core-research-portal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-test-results
          path: test-results/
