name: Content validation

on:
  pull_request:
    paths: ["content/**", "schemas/**", "deploy/site_visibility.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m coscientist.site validate-content --portal-root .
      - run: python tests/run_all.py
      - run: node scripts/check-visibility.mjs
